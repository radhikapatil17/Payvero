name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      # Runs `tsc -b` before Vite, so type errors fail here too.
      - name: Build
        working-directory: frontend
        run: npm run build
      # Bundle shape is invisible to the tests: swapping the lazy chart import
      # for a static one keeps every test green and only makes the download
      # worse, so it is checked against the built output instead.
      - name: Check bundle
        working-directory: frontend
        run: npm run check:bundle
